# A small, opinionated ~/.tmux.conf for robot work.
#
# Copy it, or append the parts you like:
#     cp tmux.conf ~/.tmux.conf
#     tmux source-file ~/.tmux.conf
#
# Nothing here is required. The defaults work; these just remove paper cuts.

# --- the things you will actually notice --------------------------------
set -g mouse on                     # click panes, drag borders, scroll with the wheel
set -g history-limit 50000          # scrollback: enough to read a long traceback
set -g base-index 1                 # windows are 1..n, not 0..n
setw -g pane-base-index 1
set -g renumber-windows on          # no gaps after you close a window

# Show the program name (and our custom title) on every pane border.
set -g pane-border-status top
set -g pane-border-format ' #{pane_index} · #{pane_title} '

# A status bar that tells you the session name and when the prefix is armed.
set -g status-left ' #[bold]#S '
set -g status-right ' %H:%M  #{?client_prefix,#[reverse] PREFIX #[default],} '
set -g status-interval 5

# --- terminal behaviour -------------------------------------------------
set -g default-terminal "screen-256color"   # widely available, including macOS
set -g escape-time 10                       # snappier Esc in vim/agents
set -g focus-events on
set -g set-clipboard on                     # use the system clipboard when possible

# Keep the pane visible after its process exits, so a crash is readable
# instead of the pane vanishing. (Our launcher also keeps a shell open.)
set -g remain-on-exit on

# --- a couple of conveniences -------------------------------------------
# Reload this file with prefix + r.
bind r source-file ~/.tmux.conf \; display "reloaded ~/.tmux.conf"

# Split with the keys that look like the split (| and -), keeping C-b as prefix.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New windows and splits inherit the current directory, like a good terminal.
bind c new-window -c "#{pane_current_path}"
